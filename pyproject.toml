[tool.poetry]
name = "drone-vehicle-detection"
version = "0.1.0"
description = "Aerial vehicle detection and auto-labeling pipeline"
authors = ["E1phant <arturkhodalovskiy@gmail.com>"]
readme = "README.md"

packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
torch = "^2.2.0"
torchvision = "^0.17.0"
timm = "^1.0.28"
albumentations = "^2.0.8"
pandas = "^2.2.0"
numpy = "^1.26.0"
joblib = "^1.5.3"
hydra-core = "^1.3.5"
omegaconf = "^2.3.1"

# Computer Vision & Detection Pipeline
opencv-python = "^4.9.0"
ultralytics = "^8.2.0"
supervision = "^0.20.0"
pycocotools = "^2.0.7"
scipy = "^1.12.0"
transformers = "^4.40.0"
accelerate = "^0.29.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.4.0"
black = "^24.4.0"
jupyter = "^1.0.0"
ipykernel = "^6.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"